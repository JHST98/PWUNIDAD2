<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Productos - Tarea Unidad 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📦 Productos</h1>

    <form id="formProducto" class="form-producto" enctype="multipart/form-data">
      <h2>Agregar nuevo producto</h2>
      <input type="text" id="nombre" placeholder="Nombre" required>
      <input type="number" id="precio" placeholder="Precio" required step="0.01">
      <input type="text" id="descripcion" placeholder="Descripción">
      <input type="file" id="imagen" accept="image/*">
      <button type="submit">➕ Crear Producto</button>
    </form>

    <div id="lista" class="lista-productos"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
